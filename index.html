<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7762ed" />
    <meta
      name="description"
      content="NOVA ERP — единое пространство для команды, продаж и роста e-commerce бизнеса."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>NOVA — пространство вашего бизнеса</title>
    <script>
      try {
        var t = JSON.parse(
          localStorage.getItem("nova-preferences") || "{}",
        ).theme;
        if (
          t === "dark" ||
          (!t && matchMedia("(prefers-color-scheme: dark)").matches)
        )
          document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
